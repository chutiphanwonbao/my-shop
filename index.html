<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าคิดเงิน - ร้านขายของชำ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { font-family: 'Prompt', sans-serif; }
        body { background-color: #f4f6f9; padding-bottom: 30px; }
        .card-custom { background: white; border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #222; min-height: 180px; }
        .cart-item { border-bottom: 1px dashed #dee2e6; padding: 10px 0; }
        .total-banner { background: #0d6efd; color: white; border-radius: 12px; padding: 15px; }
        .qty-btn { width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="container my-3" style="max-width: 480px;">
        <div class="card card-custom p-4">
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="m-0 fw-bold"><i class="fa-solid fa-cash-register me-2 text-primary"></i>คิดเงิน</h4>
                <a href="manage.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-boxes-stacked me-1"></i>คลังสินค้า</a>
            </div>

            <!-- โซนสแกนบาร์โค้ด -->
            <div class="mb-3 text-center">
                <div id="reader" class="d-flex align-items-center justify-content-center text-white mb-2">
                    <span id="cameraStatus">กดปุ่มด้านล่างเพื่อเปิดกล้องสแกน</span>
                </div>
                <button type="button" id="toggleCamBtn" class="btn btn-sm btn-outline-primary" onclick="toggleCamera()">
                    <i class="fa-solid fa-camera me-1"></i>เปิดกล้องสแกนสินค้า
                </button>
            </div>

            <!-- สลับโหมด -->
            <ul class="nav nav-pills nav-justified mb-3">
                <li class="nav-item">
                    <button class="nav-link active py-1 small" id="tab-search" onclick="switchMode('search')"><i class="fa-solid fa-magnifying-glass me-1"></i>ค้นหาในคลัง</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link py-1 small" id="tab-custom" onclick="switchMode('custom')"><i class="fa-solid fa-pen-to-square me-1"></i>สินค้าอื่นๆ / กำหนดราคาเอง</button>
                </li>
            </ul>

            <!-- โซนค้นหาในคลัง -->
            <div id="searchModeZone" class="input-group mb-3">
                <input type="text" id="searchInput" class="form-control" placeholder="พิมพ์บาร์โค้ด, รหัส 5 หลัก หรือชื่อสินค้า">
                <button class="btn btn-primary" type="button" onclick="searchAndAddProduct()"><i class="fa-solid fa-plus me-1"></i>เพิ่ม</button>
            </div>

            <!-- โซนสินค้าอื่นๆ -->
            <div id="customModeZone" class="mb-3" style="display: none;">
                <div class="row g-2 mb-2">
                    <div class="col-7">
                        <input type="text" id="customName" class="form-control form-control-sm" placeholder="ชื่อสินค้า (เช่น น้ำแข็ง, ผัก)">
                    </div>
                    <div class="col-5">
                        <input type="number" id="customPrice" class="form-control form-control-sm" placeholder="ราคา (บาท)" step="0.5">
                    </div>
                </div>
                <button class="btn btn-sm btn-success w-100 fw-bold" type="button" onclick="addCustomProduct()">
                    <i class="fa-solid fa-cart-plus me-1"></i>เพิ่มเข้าตะกร้า
                </button>
            </div>

            <!-- รายการในตะกร้า -->
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold m-0"><i class="fa-solid fa-cart-shopping me-2"></i>รายการ (<span id="itemCount">0</span>)</h6>
                    <button class="btn btn-sm btn-link text-danger p-0 text-decoration-none" onclick="clearCart()"><i class="fa-solid fa-rotate-left me-1"></i>ล้างตะกร้า</button>
                </div>
                <div id="cartList" class="border-top border-bottom py-2" style="min-height: 120px; max-height: 220px; overflow-y: auto;">
                    <div class="text-center text-muted py-4 small">ยังไม่มีสินค้าในตะกร้า</div>
                </div>
            </div>

            <!-- ยอดรวม -->
            <div class="total-banner text-center mb-3">
                <span class="small opacity-75">รวมราคาทั้งสิ้น</span>
                <h2 class="m-0 fw-bold"><span id="grandTotal">0.00</span> บาท</h2>
            </div>

            <!-- คำนวณเงินทอน -->
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label small fw-medium">รับเงินมา (บาท)</label>
                    <input type="number" id="cashInput" class="form-control" placeholder="0.00" oninput="calculateChange()">
                </div>
                <div class="col-6">
                    <label class="form-label small fw-medium">เงินทอน (บาท)</label>
                    <input type="text" id="changeOutput" class="form-control bg-light" placeholder="0.00" readonly>
                </div>
            </div>

            <!-- ปุ่มบันทึกประวัติการขาย -->
            <button type="button" id="checkoutBtn" class="btn btn-success w-100 py-3 fw-bold fs-5 shadow-sm" onclick="checkout()">
                <i class="fa-solid fa-floppy-disk me-2"></i>ชำระเงินและบันทึกประวัติ
            </button>

        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzrdQG6AsybHZToeK8HAD3YkvXEpalw3s6Mtrd9AWC_BlBlCWexqF6T0e-Em9656nzY/exec";

        let productsList = [];
        let cart = [];
        let html5QrCode = null;
        let isCamOpen = false;

        // ตัวแปรสำหรับหน่วงเวลาการสแกนเฉพาะสินค้าชิ้นเดิม (10 วินาที)
        let lastScannedCode = "";
        let lastScanTime = 0;
        const SCAN_COOLDOWN = 10000; // 10 วินาที

        window.onload = function() {
            let callbackName = "handleLoadProducts_" + Math.round(Math.random() * 1000000);
            window[callbackName] = function(data) {
                if (Array.isArray(data)) productsList = data;
                delete window[callbackName];
                let scriptElem = document.getElementById(callbackName);
                if (scriptElem) scriptElem.remove();
            };

            let script = document.createElement("script");
            script.id = callbackName;
            script.src = WEB_APP_URL + "?callback=" + callbackName;
            document.body.appendChild(script);
        };

        function switchMode(mode) {
            if (mode === 'search') {
                document.getElementById("searchModeZone").style.display = "flex";
                document.getElementById("customModeZone").style.display = "none";
                document.getElementById("tab-search").className = "nav-link active py-1 small";
                document.getElementById("tab-custom").className = "nav-link py-1 small";
            } else {
                document.getElementById("searchModeZone").style.display = "none";
                document.getElementById("customModeZone").style.display = "block";
                document.getElementById("tab-search").className = "nav-link py-1 small";
                document.getElementById("tab-custom").className = "nav-link active py-1 small";
            }
        }

        function addCustomProduct() {
            let name = document.getElementById("customName").value.trim() || "สินค้าทั่วไป";
            let priceInput = document.getElementById("customPrice").value.trim();
            let price = parseFloat(priceInput);

            if (priceInput === "" || isNaN(price) || price <= 0) {
                alert("⚠️ กรุณากรอกราคาขายให้ถูกต้อง");
                document.getElementById("customPrice").focus();
                return;
            }

            let customKey = "CUSTOM_" + name + "_" + price;
            let existItem = cart.find(item => item.barcode === customKey);

            if (existItem) {
                existItem.qty += 1;
            } else {
                cart.push({ barcode: customKey, name: name, price: price, qty: 1 });
            }

            document.getElementById("customName").value = "";
            document.getElementById("customPrice").value = "";
            renderCart();
        }

        function searchAndAddProduct(code = null) {
            let searchKey = (code || document.getElementById("searchInput").value).toString().trim().toLowerCase();
            if (!searchKey) return;

            let found = productsList.find(p => {
                let pBarcode = (p[0] || "").toString().trim().toLowerCase();
                let pName = (p[1] || "").toString().trim().toLowerCase();
                let cleanSearch = searchKey.replace(/^0+/, '');
                let cleanBarcode = pBarcode.replace(/^0+/, '');

                return pBarcode === searchKey || 
                       (cleanSearch !== "" && cleanBarcode === cleanSearch) || 
                       pName.includes(searchKey);
            });

            if (found) {
                let barcode = found[0];
                let name = found[1];
                let price = parseFloat(found[2]) || 0;

                let existItem = cart.find(item => item.barcode === barcode);
                if (existItem) {
                    existItem.qty += 1;
                } else {
                    cart.push({ barcode, name, price, qty: 1 });
                }

                document.getElementById("searchInput").value = "";
                renderCart();
            } else {
                alert("❌ ไม่พบสินค้ารหัส/ชื่อ: \"" + searchKey + "\"");
            }
        }

        // แสดงผลตารางพร้อมปุ่มเพิ่ม/ลด (+/-)
        function renderCart() {
            let cartList = document.getElementById("cartList");
            let total = 0;
            let totalQty = 0;

            if (cart.length === 0) {
                cartList.innerHTML = '<div class="text-center text-muted py-4 small">ยังไม่มีสินค้าในตะกร้า</div>';
                document.getElementById("grandTotal").innerText = "0.00";
                document.getElementById("itemCount").innerText = "0";
                calculateChange();
                return;
            }

            let html = "";
            cart.forEach((item, index) => {
                let itemTotal = item.price * item.qty;
                total += itemTotal;
                totalQty += item.qty;

                html += `
                    <div class="cart-item d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold">${item.name}</div>
                            <small class="text-muted">${item.price} บาท/ชิ้น</small>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <!-- ปุ่มบวก-ลบ จำนวนสินค้า -->
                            <div class="d-flex align-items-center bg-light rounded-pill px-1 border">
                                <button class="btn btn-sm btn-outline-secondary qty-btn" onclick="updateQty(${index}, -1)"><i class="fa-solid fa-minus fs-7"></i></button>
                                <span class="fw-bold px-2 small">${item.qty}</span>
                                <button class="btn btn-sm btn-outline-secondary qty-btn" onclick="updateQty(${index}, 1)"><i class="fa-solid fa-plus fs-7"></i></button>
                            </div>
                            <span class="fw-bold text-primary ms-1" style="min-width: 60px; text-align: right;">${itemTotal.toFixed(2)}</span>
                            <button class="btn btn-sm btn-outline-danger py-0 px-2 ms-1" onclick="removeItem(${index})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            cartList.innerHTML = html;
            document.getElementById("grandTotal").innerText = total.toFixed(2);
            document.getElementById("itemCount").innerText = totalQty;
            calculateChange();
        }

        // ฟังก์ชันปรับเพิ่ม/ลด จำนวนสินค้า (+/-)
        function updateQty(index, change) {
            if (cart[index]) {
                cart[index].qty += change;
                if (cart[index].qty <= 0) {
                    cart.splice(index, 1);
                }
                renderCart();
            }
        }

        function removeItem(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function clearCart() {
            cart = [];
            document.getElementById("cashInput").value = "";
            renderCart();
        }

        function calculateChange() {
            let total = parseFloat(document.getElementById("grandTotal").innerText) || 0;
            let cash = parseFloat(document.getElementById("cashInput").value) || 0;
            let change = cash - total;

            let changeOutput = document.getElementById("changeOutput");
            if (cash > 0 && change >= 0) {
                changeOutput.value = change.toFixed(2);
                changeOutput.className = "form-control bg-success text-white fw-bold";
            } else {
                changeOutput.value = change < 0 ? "เงินไม่พอ" : "0.00";
                changeOutput.className = "form-control bg-light text-danger";
            }
        }

        function checkout() {
            if (cart.length === 0) {
                alert("⚠️ กรุณาเลือกสินค้าเข้าตะกร้าก่อนทำการชำระเงิน");
                return;
            }

            let total = parseFloat(document.getElementById("grandTotal").innerText) || 0;
            let cash = parseFloat(document.getElementById("cashInput").value) || 0;

            if (cash < total) {
                alert("⚠️ เงินที่รับมาน้อยกว่าราคาสินค้ารวม!");
                document.getElementById("cashInput").focus();
                return;
            }

            let btn = document.getElementById("checkoutBtn");
            btn.disabled = true;
            btn.innerText = "กำลังบันทึกประวัติการขาย...";

            let summary = cart.map(i => `${i.name} (x${i.qty})`).join(", ");

            let formData = new URLSearchParams();
            formData.append("action", "checkout");
            formData.append("itemsSummary", summary);
            formData.append("total", total);

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData.toString()
            })
            .then(() => {
                alert("✅ บันทึกการขายเรียบร้อย!\nเงินทอน: " + document.getElementById("changeOutput").value + " บาท");
                clearCart();
            })
            .catch(err => {
                alert("เกิดข้อผิดพลาดในการบันทึก");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-2"></i>ชำระเงินและบันทึกประวัติ';
            });
        }

        // ระบบสแกนกล้องแบบ POS ห้าง
        async function toggleCamera() {
            const btn = document.getElementById("toggleCamBtn");
            const statusText = document.getElementById("cameraStatus");

            if (isCamOpen) {
                if (html5QrCode) {
                    await html5QrCode.stop();
                    html5QrCode = null;
                }
                isCamOpen = false;
                btn.className = "btn btn-sm btn-outline-primary";
                btn.innerHTML = '<i class="fa-solid fa-camera me-1"></i>เปิดกล้องสแกนสินค้า';
                if(statusText) statusText.style.display = "block";
            } else {
                try {
                    if (!html5QrCode) {
                        html5QrCode = new Html5Qrcode("reader");
                    }
                    if(statusText) statusText.style.display = "none";

                    await html5QrCode.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 250, height: 150 } },
                        (decodedText) => {
                            let currentTime = new Date().getTime();

                            // 🧠 ตรรกะห้าง:
                            // 1. ถ้าบาร์โค้ดไม่เหมือนเดิม -> สแกนติดทันที (ไม่รอ)
                            // 2. ถ้าเป็นบาร์โค้ดเดิม -> ต้องรอผ่านไป 10 วินาที ถึงจะยอมให้ยิงซ้ำ
                            if (decodedText === lastScannedCode && (currentTime - lastScanTime) < SCAN_COOLDOWN) {
                                return;
                            }

                            lastScannedCode = decodedText;
                            lastScanTime = currentTime;

                            searchAndAddProduct(decodedText);
                            if (navigator.vibrate) navigator.vibrate(100);
                        },
                        (err) => {}
                    );

                    isCamOpen = true;
                    btn.className = "btn btn-sm btn-outline-danger";
                    btn.innerHTML = '<i class="fa-solid fa-camera-rotate me-1"></i>ปิดกล้อง';
                } catch (err) {
                    alert("⚠️ ไม่สามารถเปิดกล้องได้ โปรดตรวจสอบสิทธิ์กล้อง");
                }
            }
        }
    </script>
</body>
</html>
