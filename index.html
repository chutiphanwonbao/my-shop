<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านขายของชำ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="p-3">
    <div class="container text-center">
        <h4>🛒 คิดเงินร้านขายของชำ</h4>
        <div id="reader" style="width: 100%; max-width: 400px; margin: auto;"></div>
        
        <hr>
        <h5>เลือกสินค้าไม่มีบาร์โค้ด</h5>
        <button class="btn btn-outline-primary btn-sm" onclick="addItem('ไข่ไก่', 5)">ไข่ไก่ (5฿)</button>
        <button class="btn btn-outline-primary btn-sm" onclick="addItem('ผักบุ้ง', 10)">ผักบุ้ง (10฿)</button>

        <hr>
        <ul id="cart" class="list-group mb-3 text-start"></ul>
        <h4>รวม: <span id="total" class="text-danger">0</span> บาท</h4>
        
        <button class="btn btn-success w-100 mt-3" onclick="sendToGoogleSheet()">✅ คิดเงิน & บันทึกลง Google Sheet</button>
    </div>

    <script>
        // 🔗 วาง URL ที่ได้จาก Google Apps Script ที่นี่
        const WEB_APP_URL = "วาง_URL_GOOGLE_APPS_SCRIPT_ที่นี่";

        // รายการสินค้าในระบบ (บาร์โค้ด -> ชื่อ, ราคา)
        const db = {
            "8850123456789": { name: "เลย์ 20 บาท", price: 20 },
            "8850987654321": { name: "น้ำดื่ม ช้าง", price: 7 }
        };

        let cart = [];
        let total = 0;

        // สแกนบาร์โค้ด
        let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        scanner.render((barcode) => {
            if (db[barcode]) {
                addItem(db[barcode].name, db[barcode].price);
            } else {
                alert("ไม่พบบาร์โค้ดนี้: " + barcode);
            }
        });

        function addItem(name, price) {
            cart.push({ name, price });
            total += price;
            renderCart();
        }

        function renderCart() {
            let html = "";
            cart.forEach(item => {
                html += `<li class="list-group-item d-flex justify-content-between">${item.name} <span>${item.price} ฿</span></li>`;
            });
            document.getElementById("cart").innerHTML = html;
            document.getElementById("total").innerText = total;
        }

        // ส่งข้อมูลตรงเข้า Google Sheet โดยไม่ผ่าน Server ตัวกลาง
        function sendToGoogleSheet() {
            if (cart.length === 0) return alert("ยังไม่มีสินค้าในตะกร้า");

            let itemSummary = cart.map(i => i.name).join(", ");

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ items: itemSummary, total: total })
            }).then(() => {
                alert("บันทึกลง Google Sheet เรียบร้อย!");
                cart = [];
                total = 0;
                renderCart();
            });
        }
    </script>
</body>
</html>
