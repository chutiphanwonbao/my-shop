<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังสินค้า - ร้านขายของชำ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { font-family: 'Prompt', sans-serif; }
        body { background-color: #f4f6f9; padding-bottom: 30px; }
        .card-custom { background: white; border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="container my-3" style="max-width: 480px;">
        <div class="card card-custom p-4">
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="m-0 fw-bold"><i class="fa-solid fa-boxes-stacked me-2 text-primary"></i>เพิ่มสินค้าใหม่</h4>
                <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-cash-register me-1"></i>ไปหน้าคิดเงิน</a>
            </div>

            <!-- สแกนบาร์โค้ด -->
            <div id="reader" class="mb-3"></div>

            <form id="productForm">
                <div class="mb-3">
                    <label class="form-label small fw-medium">ประเภทสินค้า</label>
                    <select id="pType" class="form-select" onchange="toggleBarcodeField()">
                        <option value="barcode">มีบาร์โค้ดจริง</option>
                        <option value="manual">ไม่มีบาร์โค้ด (สร้างรหัสอัตโนมัติ 5 หลัก)</option>
                    </select>
                </div>

                <div class="mb-3" id="barcodeGroup">
                    <label class="form-label small fw-medium">รหัสบาร์โค้ด</label>
                    <input type="text" id="pBarcode" class="form-control" placeholder="สแกนกล้อง หรือ รหัส 5 หลัก เช่น 00001">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-medium">ชื่อสินค้า</label>
                    <input type="text" id="pName" class="form-control" placeholder="เช่น ไข่ไก่, ผักบุ้ง" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-medium">ราคาขาย (บาท)</label>
                    <input type="number" id="pPrice" class="form-control" placeholder="0.00" step="0.5" required>
                </div>

                <button type="button" class="btn btn-primary w-100 py-2 fw-bold" onclick="saveProduct()">
                    <i class="fa-solid fa-floppy-disk me-2"></i>บันทึกเข้า Google Sheet
                </button>
            </form>

        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxg7CUckIt30WEqFiHTW9u6UvlmjnYO54YbEdvOjkcvX_9NNjexu2wUy3ncOqqVcWAc/exec";

        let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 120 } });
        scanner.render((barcode) => {
            document.getElementById("pBarcode").value = barcode;
            document.getElementById("pType").value = "barcode";
            toggleBarcodeField();
        });

        function toggleBarcodeField() {
            let type = document.getElementById("pType").value;
            document.getElementById("barcodeGroup").style.display = (type === "manual") ? "none" : "block";
        }

        function saveProduct() {
            let type = document.getElementById("pType").value;
            let barcode = document.getElementById("pBarcode").value.trim();
            let name = document.getElementById("pName").value.trim();
            let priceInput = document.getElementById("pPrice").value.trim();
            let price = parseFloat(priceInput);

            // ⛔ 1. เช็กห้ามเป็นค่าว่าง
            if (name === "") {
                alert("⚠️ กรุณากรอก \"ชื่อสินค้า\" (ห้ามเว้นว่าง)");
                document.getElementById("pName").focus();
                return;
            }

            if (priceInput === "" || isNaN(price) || price < 0) {
                alert("⚠️ กรุณากรอก \"ราคาขาย\" ให้ถูกต้อง (ต้องมากกว่าหรือเท่ากับ 0 บาท)");
                document.getElementById("pPrice").focus();
                return;
            }

            if (type === "barcode" && barcode === "") {
                alert("⚠️ สินค้าประเภท \"มีบาร์โค้ด\" กรุณาสแกนหรือกรอกรหัสบาร์โค้ดด้วยครับ");
                document.getElementById("pBarcode").focus();
                return;
            }

            let saveBtn = document.querySelector("button[onclick='saveProduct()']");
            saveBtn.disabled = true;
            saveBtn.innerText = "กำลังตรวจสอบและบันทึก...";

            // 2. ส่งข้อมูลผ่าน JSONP เพื่อรับผลลัพธ์การเช็กชื่อซ้ำจาก Google Apps Script
            let callbackName = "handleResponse_" + Math.round(Math.random() * 1000000);

            window[callbackName] = function(response) {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk me-2"></i>บันทึกเข้า Google Sheet';

                if (response.status === "DUPLICATE_NAME") {
                    alert("❌ ไม่สามารถบันทึกได้: มีชื่อสินค้านี้ (\"" + name + "\") ในระบบแล้ว!");
                } else if (response.status === "DUPLICATE_BARCODE") {
                    alert("❌ ไม่สามารถบันทึกได้: บาร์โค้ดนี้ (\"" + barcode + "\") ถูกใช้งานแล้ว!");
                } else if (response.status === "SUCCESS") {
                    alert("✅ บันทึกสินค้าเรียบร้อยแล้ว! (รหัสสินค้า: " + response.barcode + ")");
                    document.getElementById("productForm").reset();
                } else {
                    alert("เกิดข้อผิดพลาดในการบันทึก");
                }

                delete window[callbackName];
                let scriptElem = document.getElementById(callbackName);
                if (scriptElem) scriptElem.remove();
            };

            let url = WEB_APP_URL + "?action=addProduct" +
                      "&type=" + encodeURIComponent(type) +
                      "&barcode=" + encodeURIComponent(barcode) +
                      "&name=" + encodeURIComponent(name) +
                      "&price=" + encodeURIComponent(price) +
                      "&callback=" + callbackName;

            let script = document.createElement("script");
            script.id = callbackName;
            script.src = url;
            script.onerror = function() {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk me-2"></i>บันทึกเข้า Google Sheet';
                alert("ไม่สามารถเชื่อมต่อกับ Google Apps Script ได้");
            };
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
